<!DOCTYPE html>
<html lang="pl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#2f6f4f">
	<meta name="description" content="Prosta lista stałych rachunków do odhaczania co miesiąc.">
	<link rel="manifest" href="manifest.json">
	<link rel="icon" href="icon-192.png" type="image/png">
	<link rel="apple-touch-icon" href="icon-192.png">
	<link rel="stylesheet" href="style.css">
	<title>Moje Rachunki</title>
</head>

<body>
	<header class="header">
		<h1>Moje Rachunki</h1>
		<p id="month" class="month"></p>
	</header>

	<main class="container">
		<form id="add-form" class="add-form">
			<input id="bill-name" type="text" placeholder="Nazwa rachunku, np. Tauron" maxlength="40" required>
			<button type="submit">Dodaj</button>
		</form>

		<ul id="bill-list" class="bill-list"></ul>

		<p id="empty" class="empty" hidden>Brak rachunków. Dodaj pierwszy powyżej.</p>
	</main>

	<script src="main.js"></script>
</body>

</html>
